[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bucco"
version = "0.1.0"
description = "Season win forecasts for the Pittsburgh Pirates"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
bucco = "bucco.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bucco"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
