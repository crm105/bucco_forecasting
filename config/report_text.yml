# Written content for the HTML forecast report (`bucco report`).
#
# Edit the wording here, then re-run `bucco report` to rebuild the page. Do not edit the
# generated files in reports/: they are overwritten the next time a report is built.
#
# Rules:
#   - Plain text only. **double asterisks** make bold text. HTML is shown as typed.
#   - {placeholders} are filled in by the report. Each entry lists the ones it may use in
#     the comment above it; any other {braces} stop the build with an error naming the entry.
#   - Numbers come from the data, so keep sentences true for any value (do not write
#     "a small chance" next to a placeholder that could be 90%).

# Page header. {season}
kicker: "Bucco Forecasting"
title: "Pittsburgh Pirates {season} forecast"

badges:
  record: "Forecast of record"
  preliminary: "Preliminary: before Opening Day"
  late: "Made after Opening Day: not the forecast of record"

# Shown after the badge. {as_of}, {opening_day_note}. The note is "Opening Day is DATE." or empty.
date_line: "Forecast as of {as_of}. {opening_day_note}"

# Headline box. {low}, {high}
hero_explanation: >-
  Out of 100 seasons that start like this one, about 80 should end with the Pirates between
  {low} and {high} wins. The range is wide because baseball is unpredictable: even a perfect
  model would miss by about 6 wins in a typical season from luck alone.
fact_above_500: "chance of finishing above .500 (82 or more wins)"
# {last_wins}, {last_season}
fact_beat_last: "chance of winning more than the {last_wins} games they won in {last_season}"

what_changed_heading: "What changed"
# {season}
what_changed_first: "This is the first saved forecast for {season}."
# {before}, {now}, {delta}, {before_date}
what_changed_moved: >-
  Pirates expected wins moved from {before} to {now} ({delta}) since the forecast as of
  {before_date}.
# {before_model}
what_changed_model: >-
  The earlier forecast used the {before_model} model, so part of the change is the model.
what_changed_unchanged: "The model and inputs are unchanged."

timeline_heading: "How the Pirates forecast has moved"
timeline_intro: "Expected wins by forecast date, with the 80% range shaded."

league_heading: "The whole league"
league_intro: "Dot: expected wins. Bar: 80% range. Dashed line: 81 wins. Pirates in gold."

trust_heading: "How much to trust this"
# {model_label}, {first_season}, {last_season}
trust_intro: >-
  This forecast comes from the **{model_label}** model. Each model is tested by forecasting every
  MLB team's record for every season it can cover, using only information from before that season,
  and the scores below come from that test. Models that use only team records cover every season
  from {first_season} to {last_season}; models built from player projections cover only the
  seasons with projection files or rosters (ZiPS from 2011, Steamer from 2012, our own from 2009),
  so their scores rest on fewer, more recent seasons. The 2020 season (60 games) is left out of
  the scores.
table_note: >-
  Typical miss is the average error. RMSE punishes large misses more. Some seasons are harder to
  forecast than others, so models are ranked by RMSE over the seasons every model covers. A
  well-calibrated 80% range should hold about 80% of results.

past_heading: "The Pirates in past seasons"
past_intro: >-
  How far this model's Pirates forecast was from their actual wins (2020 scaled to 162 games).
  Bars above zero mean the model was too high. This is for interest only and is not used to
  choose models.

unknowns_heading: "What this forecast does not know"
# {as_of}
unknowns:
  - "Trades, signings and injuries that happen after {as_of}."
  - >-
    Anything outside the model's inputs. Models that use only team records know nothing about
    individual players; models built from player projections know the rosters and projections
    as of {as_of}, not later moves or call-ups.

# {today}, {commit_note}. The note is "Code version ABC." or empty.
footer: >-
  Generated {today}. {commit_note} Season data from the MLB Stats API (statsapi.mlb.com), used
  for personal, non-commercial purposes under MLB's posted terms.

# How each model is named in the trust section. Add an entry when a new model is added.
model_labels:
  constant: "Constant (every team wins 81)"
  last_year: "Last year (every team repeats last season's record)"
  holt: "Smoothed history (each team's past seasons, weighted toward recent ones)"
  depth_chart: "ZiPS (FanGraphs player projections, shared out by our depth chart)"
  zips_optimized: "ZiPS, optimized (FanGraphs player projections; our lineup optimizer)"
  steamer: "Steamer (FanGraphs player projections, each team's WAR summed)"
  steamer_optimized: "Steamer, optimized (FanGraphs player projections; our lineup optimizer)"
  blend_optimized: "Steamer and ZiPS blend (both optimized, weight fitted on past seasons)"
  marcel_staff_optimized: >-
    Marcel staff-optimized (our own player projections, with lineups and pitching staffs
    optimized)
  marcel_ml_pitchers: >-
    Marcel with learned pitchers (our own player projections, pitcher innings and rates from
    learned models, with lineups and pitching staffs optimized)
  marcel_ml_hitter_pa: >-
    Marcel with learned playing time (our own player projections; hitters' PA, pitchers' innings
    and rates from learned models; pitching staffs optimized)
