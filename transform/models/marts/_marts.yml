version: 2

models:
  - name: team_seasons
    description: >
      Actual results: one row per team per completed season from 2000 on. Used for scoring
      forecasts in the backtest and as history for models. Models should read their inputs
      from `team_season_features`, not from here, so the season being forecast is never visible
      to them.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, team_id]
    columns:
      - name: season
        description: '{{ doc("season") }}'
        data_tests: [not_null]
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests:
          - not_null
          - relationships:
              to: ref('teams')
              field: team_id
      - name: team_abbr
        description: Current team abbreviation, e.g. `PIT`.
      - name: team_name
        description: Current team name.
      - name: league_id
        description: 103 for the American League, 104 for the National League.
      - name: division_id
        description: MLB division id (200 to 205).
      - name: games_played
        description: '{{ doc("games_played") }}'
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 165
      - name: wins
        description: '{{ doc("wins") }}'
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 165
      - name: losses
        description: '{{ doc("losses") }}'
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 165
      - name: win_pct
        description: '{{ doc("win_pct") }}'
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: runs_scored
        description: Runs scored over the season.
      - name: runs_allowed
        description: Runs allowed over the season.
      - name: run_diff
        description: Runs scored minus runs allowed.
      - name: is_shortened_season
        description: '{{ doc("is_shortened_season") }}'
      - name: made_playoffs
        description: True if the team made the postseason (any berth).
      - name: won_division
        description: True if the team won its division (with or without a first-round bye).

  - name: team_season_features
    description: >
      Inputs for forecasting: one row per team per season to forecast, with columns from the
      PRIOR season only. Includes one row per team for the upcoming season (the season after
      the latest completed one), where results do not exist yet. Nothing from the target
      season appears in this table, which is what keeps the backtest honest.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, team_id]
    columns:
      - name: season
        description: The season being forecast.
        data_tests: [not_null]
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests:
          - not_null
          - relationships:
              to: ref('teams')
              field: team_id
      - name: team_abbr
        description: Current team abbreviation, e.g. `PIT`.
      - name: team_name
        description: Current team name.
      - name: opening_day
        description: >
          Opening Day of the season being forecast. Null if MLB has not published that
          season's calendar yet.
      - name: has_prior_season
        description: >
          True if the team has a completed prior season in the table. False only for the first
          season in the history window.
        data_tests: [not_null]
      - name: prior_season
        description: The season before the one being forecast. Null when there is no prior season.
      - name: prior_wins
        description: Wins in the prior season.
      - name: prior_losses
        description: Losses in the prior season.
      - name: prior_games_played
        description: Games played in the prior season.
      - name: prior_win_pct
        description: >
          Win percentage in the prior season. This is the prediction for model step 1 (last
          year). Null when there is no prior season.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: prior_runs_scored
        description: Runs scored in the prior season.
      - name: prior_runs_allowed
        description: Runs allowed in the prior season.
      - name: prior_run_diff
        description: Runs scored minus runs allowed in the prior season.
      - name: prior_season_shortened
        description: True if the prior season was shortened (2020). Null when there is no prior season.
      - name: prior_made_playoffs
        description: True if the team made the playoffs in the prior season.

  - name: external_projections
    description: >
      Hand-collected preseason win projections and betting win totals, with Opening Day and
      days-before-Opening-Day attached. Feeds model step 2 (blend of public forecasts). Empty
      until projection CSVs are added to data/manual/projections.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, source, as_of_date, team_id]
    columns:
      - name: season
        description: Season being projected.
        data_tests: [not_null]
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests: [not_null]
      - name: team_abbr
        description: Current team abbreviation, e.g. `PIT`.
      - name: source
        description: Lowercase name of where the numbers came from, e.g. `steamer`.
      - name: kind
        description: "`projection` for a model forecast, `market` for a betting win total."
      - name: as_of_date
        description: '{{ doc("as_of_date") }}'
      - name: opening_day
        description: Opening Day of the projected season. Null if the calendar has no entry.
      - name: days_before_opening_day
        description: >
          Days between the projection date and Opening Day. Never negative (see
          assert_projections_published_before_opening_day).
      - name: projected_wins
        description: Projected wins over a 162-game season. Betting totals can be fractional.
      - name: projected_win_pct
        description: Projected wins divided by 162. The scale models predict on.
      - name: source_url
        description: Where the numbers came from, if recorded.
      - name: notes
        description: Free-text notes from the input file.

  - name: player_projections
    description: >
      Hand-downloaded player projections with the current team abbreviation and Opening Day
      attached. One row per player per source, player type and season. These are independent
      player projections, not rosters: do not sum `war` by team and treat it as a team forecast
      (each player has his own playing-time estimate, not one allocated within a team). Allocating playing time
      is the job of the roster-based models (rung 5a). `as_of_date` is null until the download
      date is entered in `_player_downloads.csv`; models must not use undated rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, source, player_type, fangraphs_id]
    columns:
      - name: season
        description: Season being projected.
        data_tests: [not_null]
      - name: source
        description: Lowercase projection system, e.g. `zips`.
      - name: player_type
        description: "`batter` or `pitcher`."
      - name: as_of_date
        description: '{{ doc("as_of_date") }}'
      - name: opening_day
        description: Opening Day of the projected season. Null if the calendar has no entry.
      - name: days_before_opening_day
        description: >
          Days between the download date and Opening Day. Never negative (see
          assert_player_projections_published_before_opening_day). Null if the date is unknown.
      - name: fangraphs_id
        description: FanGraphs `PlayerId`, kept as text.
        data_tests: [not_null]
      - name: mlbam_id
        description: MLB Advanced Media player id, the key that matches MLB data.
      - name: player_name
        description: Player name as FanGraphs wrote it.
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests: [not_null]
      - name: team_abbr
        description: Current team abbreviation, e.g. `PIT`.
      - name: source_team_abbr
        description: Abbreviation exactly as FanGraphs wrote it (e.g. `KCR`).
      - name: war
        description: Projected WAR for the projected playing time.
      - name: plate_appearances
        description: Projected plate appearances. Null for pitchers.
      - name: innings_pitched
        description: Projected innings pitched. Null for batters.

  - name: player_positions
    description: >
      Each player's listed position for a season, determined from the PRIOR season. A row for
      season S describes where the player played in S - 1, so it can be used to forecast S
      without peeking at S. One row per player who played in the majors in S - 1; a player
      with no row (a rookie or minor leaguer) has no prior-season position yet. The newest rows
      are for the season after the latest completed one, which is the season being forecast.
      Feeds the depth chart logic (catcher and designated-hitter slots, starters and
      relievers). See `int__player_season_positions` for how positions are chosen.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, mlbam_id]
    columns:
      - name: season
        description: Season being forecast. The position comes from the season before it.
        data_tests: [not_null]
      - name: prior_season
        description: The season the position was taken from. Always `season - 1`.
        data_tests: [not_null]
      - name: mlbam_id
        description: MLB Advanced Media player id, the key that matches the ZiPS files.
        data_tests: [not_null]
      - name: player_name
        description: Player name as the API wrote it.
      - name: primary_position
        description: Position with the most games in the prior season.
        data_tests:
          - accepted_values:
              values: ['P', 'C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH']
      - name: position_group
        description: "`C`, `IF`, `OF`, `DH`, `SP` or `RP`."
        data_tests:
          - accepted_values:
              values: ['C', 'IF', 'OF', 'DH', 'SP', 'RP']
      - name: primary_games
        description: Games at the primary position in the prior season.
      - name: primary_share
        description: Share of the prior season's position games spent at the primary position.
      - name: positions_played
        description: Number of different positions played in the prior season.
      - name: is_two_way
        description: Pitched and played elsewhere a meaningful amount in the prior season.

  - name: player_preseason_status
    description: >
      Each player's status on his team's Opening Day 40-man roster: what a forecaster knows about
      injuries when the season starts. One row per season and player, from 2012; the upcoming
      season's is taken on the day of the extract.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, mlbam_id]
    columns:
      - name: season
        description: Season the roster opens.
        data_tests: [not_null]
      - name: mlbam_id
        description: MLB Advanced Media player id.
        data_tests: [not_null]
      - name: il_group
        description: "`il_60`, `il_short` (7-, 10- or 15-day) or `none`."
        data_tests:
          - not_null
          - accepted_values:
              values: ['il_60', 'il_short', 'none']

  - name: player_position_games
    description: >
      Games at each position in the PRIOR season, one row per player per position. A row for
      season S describes season S - 1, so it can be used to forecast S without peeking at S.
      Shows which positions a player can cover, not only his main one (see `player_positions`).
      Feeds the depth chart's slot eligibility.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, mlbam_id, position]
    columns:
      - name: season
        description: Season being forecast. The games come from the season before it.
        data_tests: [not_null]
      - name: prior_season
        description: The season the games were taken from. Always `season - 1`.
        data_tests: [not_null]
      - name: mlbam_id
        description: MLB Advanced Media player id.
        data_tests: [not_null]
      - name: position
        description: "`P`, `C`, `1B`, `2B`, `3B`, `SS`, `LF`, `CF`, `RF` or `DH`."
        data_tests:
          - accepted_values:
              values: ['P', 'C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH']
      - name: games
        description: Games at the position in the prior season, summed across teams.
      - name: games_started
        description: Games started at the position in the prior season.
      - name: innings
        description: Innings at the position in the prior season.
      - name: share_of_position_games
        description: This position's games divided by all the player's position games, 0 to 1.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

  - name: team_matchups
    description: >
      Scheduled games between each pair of teams per season, from each team's side (both
      orders appear, with the same count). Fixed before the season, so a model may use the
      season it forecasts (strength of schedule).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, team_id, opponent_id]
    columns:
      - name: season
        description: '{{ doc("season") }}'
        data_tests: [not_null]
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests:
          - not_null
          - relationships:
              to: ref('teams')
              field: team_id
      - name: opponent_id
        description: MLB team id of the opponent.
        data_tests: [not_null]
      - name: games
        description: Games scheduled between the two teams.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 1

  - name: league_seasons
    description: >
      League run environment and value constants per season: league wOBA and its scale and
      weights, runs per win, the FIP constant, and replacement runs per PA and per inning (set so
      the league's WAR adds up to 1,000 per 2,430 games). Built from MLB Stats API counts; close
      to FanGraphs' Guts table (2019: wOBA scale 1.167 vs 1.157, FIP constant 3.214 vs 3.214,
      runs per win 10.30 vs 10.30).
    columns:
      - name: season
        description: '{{ doc("season") }}'
        data_tests: [unique, not_null]
      - name: woba_scale
        description: Multiplier that puts wOBA on the OBP scale.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 1.05
              max_value: 1.35
      - name: fip_constant
        description: League ERA minus league (13 HR + 3 (BB + HBP) - 2 K) / IP.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 2.8
              max_value: 3.6
      - name: runs_per_win
        description: 9 x league runs per inning x 1.5 + 3 (FanGraphs' formula).
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 8.5
              max_value: 11.5

  - name: player_batting_seasons
    description: >
      What each batter did, one row per player per season from 2000 (all teams combined): age,
      position, counts, rate stats, and approximate runs and WAR on the FanGraphs scale (no park
      adjustment, no fielding runs, stolen-base baserunning only). History for our own batter
      projections; models read batter_projection_frame instead, so a forecast never sees its
      own season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, mlbam_id]
    columns:
      - name: season
        description: '{{ doc("season") }}'
        data_tests: [not_null]
      - name: mlbam_id
        description: MLB Advanced Media player id.
        data_tests: [not_null]
      - name: left_share
        description: Share of his plate appearances batting left (1 = always left; switch hitters in between).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: age
        description: Baseball age, on June 30 of the season.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 17
              max_value: 50
      - name: is_pitcher
        description: His main position that season was pitcher (two-way players are not).
      - name: woba
        description: Weighted on-base average with the season's weights (league_seasons).
      - name: batting_runs
        description: (wOBA - league wOBA) / wOBA scale x wOBA plate appearances.
      - name: baserunning_runs
        description: Stolen-base runs (FanGraphs' wSB).
      - name: positional_runs
        description: FanGraphs positional adjustment by innings at each position.
      - name: off_runs
        description: batting_runs + baserunning_runs, comparable to FanGraphs `Off`.
      - name: def_runs
        description: Positional adjustment only (no fielding runs), comparable to `Def` for an average fielder.
      - name: war_approx
        description: Approximate WAR. Close to FanGraphs for hitters; misses fielding value.

  - name: player_pitching_seasons
    description: >
      What each pitcher did, one row per player per season from 2000 (all teams combined): age,
      role, counts, rate stats, FIP and approximate FIP-based WAR (one replacement level for
      starters and relievers, so starters come out a little low and relievers a little high).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, mlbam_id]
    columns:
      - name: season
        description: '{{ doc("season") }}'
        data_tests: [not_null]
      - name: mlbam_id
        description: MLB Advanced Media player id.
        data_tests: [not_null]
      - name: left_share
        description: Share of the batters he faced who batted left.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: age
        description: Baseball age, on June 30 of the season.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 17
              max_value: 50
      - name: role
        description: "`SP` if he started at least half the games he pitched, else `RP`."
        data_tests:
          - accepted_values:
              values: ['SP', 'RP']
      - name: fip
        description: Fielding-independent pitching on the ERA scale.
      - name: war_approx
        description: Approximate FIP-based WAR.

  - name: batter_projection_frame
    description: >
      Fitting and forecasting table for our own batter projections: one row per player per
      target season, for players who batted in at least one of the three prior seasons.
      Inputs `y1_*`, `y2_*`, `y3_*` are the three prior seasons (0 counts if he did not bat);
      outcomes `target_*` are the target season (0 PA if he did not bat in a completed season,
      null for the upcoming season). Rookies are not in it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, mlbam_id]
    columns:
      - name: season
        description: Target season (the one being forecast).
        data_tests: [not_null]
      - name: mlbam_id
        description: MLB Advanced Media player id.
        data_tests: [not_null]
      - name: age
        description: Baseball age in the target season.
      - name: is_upcoming_season
        description: True for the season after the last completed one; its target_ columns are null.

  - name: pitcher_projection_frame
    description: >
      Fitting and forecasting table for our own pitcher projections, laid out like
      batter_projection_frame (`y1_*` to `y3_*` inputs, `target_*` outcomes).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, mlbam_id]
    columns:
      - name: season
        description: Target season (the one being forecast).
        data_tests: [not_null]
      - name: mlbam_id
        description: MLB Advanced Media player id.
        data_tests: [not_null]
      - name: age
        description: Baseball age in the target season.

  - name: park_factors_by_side
    description: >
      Park factors for left-side (`L`) and right-side (`R`) batters: the park_factors value
      times a shrunk difference between sides, measured from each team's own hitters at home
      and on the road over up to six seasons at the same ballpark. The differences that survive
      shrinkage are small (home runs: at most about 2%), since one team's hitters give little
      data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, team_id, side]
    columns:
      - name: side
        description: "`L` or `R`."
        data_tests:
          - accepted_values:
              values: ['L', 'R']
      - name: pf_hr
        description: Home run factor for this side.
        data_tests:
          - not_null

  - name: park_factors
    description: >
      Park factors per team and season, by kind of event (singles, doubles, triples, home runs,
      unintentional walks, hit batters, strikeouts, runs): rate in the team's home games over
      rate in its road games, pooled over the season and up to two before it at the same
      ballpark (never later seasons), shrunk toward 1 with settings from seasons up to 2011.
      `pf_*` is the full home effect (a player gets about half); `raw_*` is the single season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, team_id]
    columns:
      - name: season
        description: '{{ doc("season") }}'
        data_tests: [not_null]
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests: [not_null]
      - name: seasons_pooled
        description: Seasons at this ballpark pooled into the factor (0 to 3).
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 3
      - name: pf_runs
        description: Runs park factor (full home effect).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.7
              max_value: 1.5
      - name: pf_hr
        description: Home run park factor.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.5
              max_value: 2.0
      - name: pf_triples
        description: Triples park factor (the noisiest).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.3
              max_value: 3.0
