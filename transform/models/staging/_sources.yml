version: 2

# Raw files written by the extract code (src/bucco/extract). dbt-duckdb reads them in place
# through the `external_location` setting, so the DuckDB file never holds a second copy.
# BUCCO_DATA_DIR is set by the `bucco build` command; see config/sources.yml for details.

sources:
  - name: mlb_api
    description: >
      MLB Stats API (https://statsapi.mlb.com). Free, no key, undocumented. Saved by
      `bucco extract mlb-seasons` and `bucco extract mlb-standings`. Rebuildable at any time.
      Subject to MLB's terms (http://gdx.mlb.com/components/copyright.txt): personal,
      non-commercial use.
    tables:
      - name: seasons
        description: One row per MLB season since 1876 with the key calendar dates.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/seasons.parquet')"
        columns:
          - name: season_id
            description: Season year, e.g. `2026`.
          - name: regular_season_start_date
            description: Opening Day. Empty for very old seasons.
          - name: regular_season_end_date
            description: Last scheduled regular-season day. Empty for very old seasons.
          - name: post_season_start_date
            description: First postseason day.
          - name: post_season_end_date
            description: Last postseason day.
          - name: has_wildcard
            description: Whether the season had a wild card round or game.
          - name: fetched_at
            description: UTC time the file was downloaded.

      - name: standings
        description: >
          Final regular-season standings, one row per team per season, from 2000. One Parquet
          file per season (`season=<year>.parquet`). Only completed seasons are saved, and each
          file is checked for 30 teams and equal league wins and losses before it is written.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/standings/*.parquet')"
        columns:
          - name: season
            description: Season year.
          - name: team_id
            description: MLB team id.
          - name: team_name
            description: Team name as the API reported it for that season (e.g. `Indians` in 2020).
          - name: league_id
            description: 103 for the American League, 104 for the National League.
          - name: division_id
            description: MLB division id (200 to 205).
          - name: games_played
            description: Games played.
          - name: wins
            description: Wins.
          - name: losses
            description: Losses.
          - name: runs_scored
            description: Runs scored over the season.
          - name: runs_allowed
            description: Runs allowed over the season.
          - name: division_rank
            description: Finish in the division, 1 to 5.
          - name: clinch_indicator
            description: >
              Playoff status. Empty if the team missed the playoffs. `y` division winner,
              `z` division winner with a first-round bye, `w` wild card, `x` other playoff
              berth (2020 only). Checked against the expected number of playoff teams for
              every season from 2000 to 2026.
          - name: fetched_at
            description: UTC time the file was downloaded.

      - name: schedules
        description: >
          Regular-season schedules, one row per game, from 2000, including the next season once
          MLB publishes it. One Parquet file per season (`season=<year>.parquet`). A postponed
          game appears once with its final status; `Cancelled` rows are games moved to a new
          game id or never made up. Saved by `bucco extract mlb-schedules`.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/schedules/*.parquet')"
        columns:
          - name: season
            description: Season year.
          - name: game_pk
            description: MLB game id.
          - name: game_date
            description: Last scheduled date of the game (YYYY-MM-DD).
          - name: home_team_id
            description: MLB team id of the home team.
          - name: away_team_id
            description: MLB team id of the away team.
          - name: status
            description: Game status, e.g. `Final`, `Scheduled`, `Cancelled`.
          - name: venue_id
            description: MLB id of the ballpark the game was played (or is scheduled) in.
          - name: venue_name
            description: Ballpark name, e.g. `PNC Park`.
          - name: fetched_at
            description: UTC time the file was downloaded.

      - name: fielding
        description: >
          Who played which position, one row per player, team and position per season, from
          2000. Pitchers are position `P` and designated hitters `DH`. One Parquet file per
          season (`season=<year>.parquet`), fetched one team at a time so a player traded
          mid-season has a row for each team. Saved by `bucco extract mlb-positions`. Each file
          is checked for 30 teams and the main positions before it is written.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/fielding/*.parquet')"
        columns:
          - name: season
            description: Season year.
          - name: team_id
            description: MLB team id.
          - name: mlbam_id
            description: MLB Advanced Media player id, the key that matches the ZiPS files.
          - name: player_name
            description: Player name as the API wrote it.
          - name: position
            description: "`P`, `C`, `1B`, `2B`, `3B`, `SS`, `LF`, `CF`, `RF` or `DH`."
          - name: games
            description: Games played at the position for the team.
          - name: games_started
            description: Games started at the position for the team. For `P`, starts as a pitcher.
          - name: innings
            description: Innings at the position (thirds as decimals, so 69.2 is 69.667).
          - name: fetched_at
            description: UTC time the file was downloaded.

      - name: batting
        description: >
          Batting lines, one row per player per season, from 2000: full-season totals with the
          team he finished with. Fetched league-wide (the per-team query drops players who left
          a team mid-season). One Parquet file per season. Saved by
          `bucco extract mlb-player-stats`, which checks 30 teams, one row per player and that
          league plate appearances match league batters faced.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/batting/*.parquet')"
        columns:
          - name: season
            description: Season year.
          - name: mlbam_id
            description: MLB Advanced Media player id.
          - name: last_team_id
            description: MLB team id of the last team he played for that season.
          - name: num_teams
            description: Number of teams he played for that season.
          - name: pa
            description: Plate appearances. The other count columns are named like `hr`, `bb`, `so`.

      - name: pitching
        description: >
          Pitching lines, one row per player per season, from 2000, fetched and checked with
          `batting`. `outs` is outs recorded (innings pitched = outs / 3).
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/pitching/*.parquet')"
        columns:
          - name: season
            description: Season year.
          - name: mlbam_id
            description: MLB Advanced Media player id.
          - name: outs
            description: Outs recorded.
          - name: bf
            description: Batters faced.

      - name: park_splits
        description: >
          Team batting and pitching lines in home games and in road games, one row per season,
          team, site (`home`, `road`) and side (`batting`, `pitching`), from 2000. Saved by
          `bucco extract mlb-park-splits`, which checks 30 teams per site and side and that
          league PA at home while batting matches league PA on the road while pitching.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/park_splits/*.parquet')"
        columns:
          - name: site
            description: "`home` or `road`."
          - name: side
            description: "`batting` (the team at bat) or `pitching` (its opponents at bat)."
          - name: pa
            description: Plate appearances in those games while that side batted.

      - name: player_splits
        description: >
          Players' season lines split three ways, from 2000: batters at home and on the road
          (`home`, `road`), batters batting left and right (`bat_left`, `bat_right`), and
          pitchers against left- and right-side batters (`vs_left`, `vs_right`). One row per
          player, group and split; a traded player's teams are combined. Saved by
          `bucco extract mlb-player-splits`, which checks that each pair adds up to league PA.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/player_splits/*.parquet')"
        columns:
          - name: group
            description: "`batting` or `pitching`."
          - name: split
            description: "`home`, `road`, `bat_left`, `bat_right`, `vs_left` or `vs_right`."
          - name: pa
            description: Plate appearances (batters faced for pitchers) in the split.

      - name: rosters
        description: >
          Each team's 40-man roster on its first regular-season game, one row per team and
          player, with the player's status: `A` active, `D60`/`D15`/`D10`/`D7` injured list,
          `RM` and others in the minors. From 2009 (earlier seasons' rosters in the API are
          incomplete). For a season that has not started the snapshot is the day of the extract. Saved by `bucco extract mlb-rosters`, which checks
          30 teams and one row per player per team.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/rosters/*.parquet')"
        columns:
          - name: snapshot_date
            description: The date the roster was taken (YYYY-MM-DD).
          - name: status_code
            description: "`A`, `D60`, `D15`, `D10`, `D7`, `RM` and so on."

      - name: minor_batting
        description: >
          Minor-league batting lines, Triple-A (sport 11) to Single-A (14), one row per player,
          level and season from 2006 (no 2020), with age and league. Saved by `bucco extract
          mlb-minor-batting`, which checks each level's size and the PA arithmetic.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/minor_batting/*.parquet')"
        columns:
          - name: level
            description: "`AAA`, `AA`, `A+` or `A`."
          - name: league_id
            description: MLB id of the league (the player's last at that level).

      - name: minor_pitching
        description: >
          Minor-league pitching lines, Triple-A (sport 11) to Single-A (14), one row per pitcher,
          level and season from 2006 (no 2020), with age and league. Saved by `bucco extract
          mlb-minor-pitching`, which checks each level's size and the counts.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/minor_pitching/*.parquet')"
        columns:
          - name: outs
            description: Outs recorded (innings x 3).

      - name: minor_affiliates
        description: >
          Each season's Triple-A to Single-A teams with the major-league organization each
          belonged to (`parent_org_id`), from 2006. Saved by `bucco extract mlb-minor-affiliates`,
          which checks every organization has an affiliate at each level.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/minor_affiliates/*.parquet')"
        columns:
          - name: parent_org_id
            description: MLB team id of the organization the affiliate belonged to that season.

      - name: people
        description: >
          One row per player in `batting` or `pitching`: birth date, bats, throws and primary
          position from /people. Only new ids are fetched on each run.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/cache/mlb_api/people.parquet')"
        columns:
          - name: mlbam_id
            description: MLB Advanced Media player id.
          - name: birth_date
            description: Birth date (YYYY-MM-DD).

  - name: manual_projections
    description: >
      Preseason win projections and betting win totals collected by hand. Cannot be
      downloaded again, so the source CSVs (data/manual/projections) and the combined file
      are kept in git. Saved by `bucco extract projections`, which checks the files first.
    tables:
      - name: preseason_projections
        description: >
          One row per team per projection set. A set is one source's numbers as of one date.
          The table is empty until projection CSVs are added.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/snapshots/preseason_projections.parquet')"
        columns:
          - name: season
            description: Season being projected.
          - name: source
            description: Lowercase name of where the numbers came from, e.g. `steamer`.
          - name: kind
            description: "`projection` for a model forecast, `market` for a betting win total."
          - name: as_of_date
            description: Date the numbers were published or captured (text, `YYYY-MM-DD`).
          - name: team_id
            description: MLB team id, resolved from the abbreviation in the input file.
          - name: projected_wins
            description: Projected wins over a 162-game season. Betting totals can be fractional.
          - name: source_url
            description: Where the numbers came from, if recorded.
          - name: notes
            description: Free-text notes from the input file.
          - name: source_file
            description: Name of the CSV the row came from.

      - name: player_projections
        description: >
          One row per player per projection file: a source (e.g. `zips`), a player type
          (batter or pitcher), a season and a download date. Downloaded by hand from FanGraphs
          and saved by `bucco extract player-projections`. These are independent player
          projections, not rosters: summing them by team badly overcounts playing time.
        meta:
          external_location: "read_parquet('{{ env_var('BUCCO_DATA_DIR', '../data') }}/snapshots/player_projections.parquet')"
        columns:
          - name: season
            description: Season being projected.
          - name: source
            description: Lowercase projection system, from the file name (e.g. `zips`).
          - name: player_type
            description: "`batter` or `pitcher`."
          - name: as_of_date
            description: >
              Download date (text, `YYYY-MM-DD`), from `_player_downloads.csv`. Null if not yet
              filled in.
          - name: fangraphs_id
            description: FanGraphs `PlayerId` (text; can be non-numeric for some prospects).
          - name: mlbam_id
            description: MLB Advanced Media player id, the key that matches MLB data.
          - name: player_name
            description: Player name as FanGraphs wrote it.
          - name: team_abbr
            description: Team abbreviation as FanGraphs wrote it (e.g. `KCR`).
          - name: team_id
            description: MLB team id, resolved from the abbreviation.
          - name: war
            description: Projected WAR for the projected playing time.
          - name: source_file
            description: Name of the CSV the row came from.
